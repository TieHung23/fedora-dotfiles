palette = "catppuccin_mocha"
add_newline = true

# Two-line framed prompt. Left of the fill: distro icon, path, git, docker.
# Right of the fill: language versions, last command duration, clock.
# 󰣛 is nf-md-fedora (U+F08DB) — needs the Nerd Font installed by install-app.sh.
format = """
[╭╴](subtext0)[ 󰣛 ](fedora)\
$directory\
$git_branch\
$git_status\
$docker_context\
$fill\
$nodejs$rust$golang$python$dotnet\
$cmd_duration\
$time
[╰╴](subtext0)$character"""

[fill]
symbol = " "

[directory]
style = "blue bold"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = "  "
read_only_style = "red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Developer" = "󰲋 "
".config" = " "

[git_branch]
symbol = " "
style = "mauve"
format = "[on](subtext0) [$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = " ${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[docker_context]
symbol = " "
style = "sapphire"
format = "[$symbol$context]($style) "
only_with_files = true

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "red"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "cyan"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "yellow"
format = "[$symbol($version )]($style)"

[dotnet]
symbol = "󰪮 "
style = "mauve"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 500
style = "peach"
format = "[ $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "subtext0"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](mauve bold)"

# Catppuccin Mocha — https://github.com/catppuccin/starship
# Plus `fedora`: the Fedora brand blue, for the distro icon.
[palettes.catppuccin_mocha]
fedora    = "#51a2da"
rosewater = "#f5e0dc"
